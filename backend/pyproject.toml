[project]
name = "estatepulse-portfolio-analyst"
version = "0.1.0"
description = "Conversational real-estate portfolio analyst demo"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.117,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.10,<3",
  "httpx>=0.28,<1",
  "itsdangerous>=2.2,<3",
  "langgraph>=0.6,<2",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
ignore = ["B008", "BLE001"]
